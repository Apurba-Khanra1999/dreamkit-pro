<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="dkBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Top Specular Bevel Glow -->
    <linearGradient id="dkBevel" x1="24" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Sparkle Radiant Fill -->
    <linearGradient id="dkSpark" x1="24" y1="12" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>

    <!-- Soft Drop Shadow for Glyph -->
    <filter id="dkShadow" x="6" y="6" width="36" height="36" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1E1B4B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="48" height="48" rx="13" fill="url(#dkBg)" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12.25" stroke="url(#dkBevel)" stroke-width="1.5" />

  <!-- Iconic DreamKit Pro "D" + Spark Mark -->
  <g filter="url(#dkShadow)">
    <!-- Modern Bold Geometric D Stem & Arc -->
    <path
      d="M13 12C13 10.8954 13.8954 10 15 10H24C31.1797 10 37 15.8203 37 23C37 30.1797 31.1797 36 24 36H15C13.8954 36 13 35.1046 13 34V12ZM19 16V30H24C27.866 30 31 26.866 31 23C31 19.134 27.866 16 24 16H19Z"
      fill="url(#dkSpark)"
      fill-rule="evenodd"
      clip-rule="evenodd"
    />

    <!-- Brilliant 4-Point Radiant Spark Star (DreamKit Core) in the D Counter -->
    <path
      d="M24.5 17C24.5 20.3 22 23 18.7 23C22 23 24.5 25.7 24.5 29C24.5 25.7 27 23 30.3 23C27 23 24.5 20.3 24.5 17Z"
      fill="#FFFFFF"
    />

    <!-- Accent Micro Sparkle Dot -->
    <circle cx="34" cy="13" r="2" fill="#FDE047" />
  </g>
</svg>