<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="45%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Radial Gradients -->
    <radialGradient id="glowPurple" cx="200" cy="180" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowIndigo" cx="950" cy="420" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="600" cy="580" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.45" />
    </linearGradient>

    <!-- Brand Badge Gradient -->
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="200" cy="180" r="450" fill="url(#glowPurple)" />
  <circle cx="950" cy="420" r="480" fill="url(#glowIndigo)" />
  <circle cx="600" cy="580" r="380" fill="url(#glowCyan)" />

  <!-- Top Decorative Pill / Badge -->
  <g transform="translate(100, 75)">
    <rect width="320" height="38" rx="19" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.7" />
    <circle cx="24" cy="19" r="6" fill="#10b981" />
    <text x="40" y="24" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">
      40+ FREE IN-BROWSER UTILITIES
    </text>
  </g>

  <!-- Brand Title & Hero Area -->
  <g transform="translate(100, 155)">
    <!-- Brand Logo Mark -->
    <g transform="scale(1.5)">
      <path fill="url(#brandGrad)" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" />
    </g>

    <!-- Main Title -->
    <text x="90" y="48" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
      DreamKit <tspan fill="url(#brandGrad)">Pro</tspan>
    </text>
    <text x="0" y="112" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700">
      The Modern Developer &amp; Media Toolkit
    </text>
    <text x="0" y="150" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      Zero-server uploads. 100% private in-browser execution with instant native speeds.
    </text>
  </g>

  <!-- Feature Pill Cards Grid -->
  <g transform="translate(100, 360)">
    <!-- Pill 1: JSON & Code -->
    <g transform="translate(0, 0)">
      <rect width="230" height="56" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="22" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">⚡ Code &amp; JSON Suite</text>
    </g>

    <!-- Pill 2: PDF Studio -->
    <g transform="translate(250, 0)">
      <rect width="230" height="56" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="22" y="34" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">📄 PDF Compressor &amp; OCR</text>
    </g>

    <!-- Pill 3: Image Studio -->
    <g transform="translate(500, 0)">
      <rect width="230" height="56" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="22" y="34" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🖼️ Image &amp; Media Studio</text>
    </g>

    <!-- Pill 4: Security & Encoders -->
    <g transform="translate(750, 0)">
      <rect width="250" height="56" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="22" y="34" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🔒 JWT, Regex &amp; Encoders</text>
    </g>

    <!-- Pill 5: Audio Extractor -->
    <g transform="translate(0, 72)">
      <rect width="230" height="56" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="22" y="34" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🎵 Lossless Audio Extractor</text>
    </g>

    <!-- Pill 6: Color Harmonies -->
    <g transform="translate(250, 72)">
      <rect width="230" height="56" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="22" y="34" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🎨 Color &amp; WCAG Palette</text>
    </g>

    <!-- Pill 7: SEO Suite -->
    <g transform="translate(500, 72)">
      <rect width="230" height="56" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="22" y="34" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🔍 SERP &amp; SEO Schema</text>
    </g>

    <!-- Pill 8: Zero Uploads Guaranteed -->
    <g transform="translate(750, 72)">
      <rect width="250" height="56" rx="14" fill="#132a26" stroke="#059669" stroke-width="1.2" />
      <text x="22" y="34" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🛡️ 100% Private &amp; Offline</text>
    </g>
  </g>

  <!-- Bottom Bar with URL -->
  <g transform="translate(100, 540)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      Free Forever • No Credit Card • Zero Tracking
    </text>
    <text x="1000" y="36" text-anchor="end" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
      https://dreamkit-pro.vercel.app
    </text>
  </g>
</svg>
